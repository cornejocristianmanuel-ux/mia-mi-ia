# MIA (Mi IA): despliegue directo desde GitHub hacia Render.
# Nunca guardes claves ni contraseñas en este archivo.
services:
  - type: web
    name: mia-mi-ia
    runtime: python
    plan: 0.5c-512mb
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT --proxy-headers
    healthCheckPath: /
    envVars:
      - key: DATA_DIR
        value: /data
      - key: APP_PASSWORD
        sync: false
      - key: APP_SECRET_KEY
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5-mini
    disk:
      name: mia-memorias
      mountPath: /data
      sizeGB: 1
